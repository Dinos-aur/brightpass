<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      --bg: #050a14; --surface: #0b1424; --line: #16233a;
      --text: #e3e8f2; --muted: #b8c7e6; --accent: #8ab4ff;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f9fc; --surface: #ffffff; --line: #dde3ee;
        --text: #141a24; --muted: #4a5568; --accent: #1f5fd1;
        color-scheme: light;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 44rem; margin: 0 auto; padding: 2.5rem 16px 4rem; }
    header { display: flex; align-items: center; gap: .6rem; margin-bottom: 2rem; }
    header a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 1.1rem; }
    .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .3rem; }
    h2 { font-size: 1.35rem; margin: 2.4rem 0 .6rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
    h3 { font-size: 1.08rem; margin: 1.6rem 0 .4rem; }
    a { color: var(--accent); }
    em { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .95rem; display: block; overflow-x: auto; }
    th, td { text-align: left; vertical-align: top; padding: .55rem .7rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td:first-child { white-space: nowrap; font-weight: 500; }
    footer { margin-top: 3rem; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <header><span class="dot"></span><a href="{{ '/' | relative_url }}">Brightpass</a></header>
    {{ content }}
    <footer>Brightpass by Loop.dev</footer>
  </main>
</body>
</html>
